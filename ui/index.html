<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Companion</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card" hidden>
      <div class="aura"></div>
      <div class="grip" title="Drag to move"></div>
      <header>
        <div class="ghost-wrap"><img id="mascot" class="ghost" alt="" /></div>
        <div class="heading">
          <div class="eyebrow" id="eyebrow"></div>
          <div class="title" id="title"></div>
          <div class="meta" id="meta"></div>
        </div>
        <div class="counter" id="counter"></div>
      </header>
      <section class="tool" id="tool">
        <div class="tool-head">
          <span class="chip" id="chip"></span>
          <span class="target" id="target"></span>
        </div>
        <div class="body" id="body"></div>
      </section>
      <p class="note" id="note"></p>
      <div class="actions" id="actions"></div>
      <footer id="footer">
        <span id="footer-text"></span>
        <div class="timer"><div class="bar" id="bar"></div></div>
      </footer>
    </main>
    <script src="main.js"></script>
  </body>
</html>
